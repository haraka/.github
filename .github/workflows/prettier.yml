name: Prettier

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string

env:
  CI: true

jobs:
  prettier:
    # Skip the bot's own pushes (it re-triggers CI). Idempotency already prevents
    # a loop; this just avoids a redundant format run. Harmless if the App is
    # named differently — it simply never matches.
    if: ${{ github.triggering_actor != 'haraka-bot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        continue-on-error: true
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}
      - uses: actions/setup-node@v6
      - run: npx prettier . --write
      - run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add -A
            git commit -m "style: format code with prettier" || echo "No changes to commit"
            git push
          else
            echo "No formatting changes"
          fi

      # sync AGENTS.md from haraka/.github when central is a newer version.
      # Rides along on maintainer PRs (the caller already excludes forks); never
      # overwrites a package that pins a newer agents-version of its own.
      - name: Sync AGENTS.md
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/haraka/.github/master/AGENTS.md -o /tmp/agents.md
          ver() {
            [ -r "$1" ] || return 0
            sed -nE 's/.*agents-version:[[:space:]]*([0-9]+).*/\1/p' "$1" | head -1
          }
          cv=$(ver /tmp/agents.md); cv=${cv//[!0-9]/}; cv=${cv:-0}
          rv=$(ver AGENTS.md); rv=${rv//[!0-9]/}; rv=${rv:-0}
          if [ "$cv" -le "$rv" ]; then
            echo "AGENTS.md: local v$rv >= central v$cv; nothing to do"
            exit 0
          fi
          cp /tmp/agents.md AGENTS.md
          printf 'see AGENTS.md\n' | tee CLAUDE.md GEMINI.md >/dev/null
          mkdir -p .github
          cp /tmp/agents.md .github/copilot-instructions.md
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add AGENTS.md CLAUDE.md GEMINI.md .github/copilot-instructions.md
          git commit -m "docs: sync AGENTS.md to v$cv from haraka/.github" || echo "No changes to commit"
          git push
